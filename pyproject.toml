[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tester"
version = "0.1.0"
description = "Universal OpenAI-API compatible LLM benchmark tool"
requires-python = ">=3.9"
dependencies = [
    "openai"
]

[project.scripts]
# This creates the global terminal command "tester"
tester = "tester.benchmark:run_benchmark"
